<!DOCTYPE html>
<html>
<head>
<title>Login - UVA STORE</title>

<style>

/* 🔥 BACKGROUND */
body{
    margin:0;
    font-family:Segoe UI;

    background: linear-gradient(270deg,#1e1e2f,#2b5876,#4e4376);
    background-size:600% 600%;
    animation:bgMove 10s ease infinite;

    height:100vh;
    overflow:hidden;
    color:#fff;
}

/* BACKGROUND ANIMATION */
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* FLOATING LIGHT BLOBS */
body::before, body::after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    filter:blur(120px);
    opacity:0.25;
    animation:float 8s infinite alternate;
}

body::before{
    background:#00e0ff;
    left:10%;
    top:20%;
}

body::after{
    background:#ff5e00;
    right:10%;
    bottom:10%;
}

@keyframes float{
    from{transform:translateY(0);}
    to{transform:translateY(60px);}
}

/* 🔥 MAIN LAYOUT */
.container{
    display:flex;
    align-items:center;
    justify-content:center;   /* 🔥 FIXED ALIGNMENT */
    gap:50px;                 /* 🔥 PERFECT SPACING */
    height:100%;
}

/* 🔥 LEFT LOGO */
.logo-section{
    flex:none;
    text-align:center;
}

/* 🔥 LOGO WRAPPER */
.logo-wrapper{
    position:relative;
    display:inline-block;
}

/* 🔥 ROTATING RING */
.logo-wrapper::before{
    content:"";
    position:absolute;
    top:-10px;
    left:-10px;

    width:280px;
    height:280px;

    border-radius:50%;

    background: conic-gradient(
        #00e0ff,
        transparent,
        #ff5e00,
        transparent,
        #00e0ff
    );

    animation:rotate 6s linear infinite;
    z-index:-1;
}

@keyframes rotate{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* 🔥 ROUND LOGO */
.logo{
    width:260px;
    height:260px;

    object-fit:cover;
    border-radius:50%;

    padding:10px;
    background: rgba(255,255,255,0.05);

    box-shadow:
        0 0 25px #00e0ff,
        0 0 60px rgba(0,224,255,0.5),
        inset 0 0 20px rgba(255,255,255,0.1);

    animation:floatLogo 4s ease-in-out infinite;
}

@keyframes floatLogo{
    0%{transform:translateY(0);}
    50%{transform:translateY(-20px);}
    100%{transform:translateY(0);}
}

/* 🔥 LOGIN CARD */
.login-box{
    width:340px;
    padding:30px;

    border-radius:20px;

    background: rgba(10,20,40,0.7);
    backdrop-filter: blur(20px);

    border:1px solid rgba(255,255,255,0.2);

    box-shadow:0 0 40px rgba(0,212,255,0.3);

    animation:fadeUp 1s ease;
}

@keyframes fadeUp{
    from{opacity:0; transform:translateY(50px);}
    to{opacity:1; transform:translateY(0);}
}

.logo-wrapper:hover{
    transform:scale(1.1);
}
/* TITLE */
.title{
    text-align:center;
    font-size:24px;
    margin-bottom:20px;
}

.title span{
    color:#00e0ff;
}

/* INPUT */
.input-box{
    margin-bottom:15px;
}

.input-box input{
    width:100%;
    padding:14px;

    border:none;
    border-radius:10px;

    background:#f1f5f9;
    color:#111;

    outline:none;
}

.input-box input:focus{
    box-shadow:0 0 10px #00e0ff;
}

/* BUTTON */
button{
    width:100%;
    padding:13px;

    border:none;
    border-radius:12px;

    background: linear-gradient(45deg,#ff9f00,#ff5e00);
    color:#fff;

    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #ff9f00;
}

/* LINK */
.link{
    text-align:center;
    margin-top:15px;
}

.link a{
    color:#00e0ff;
    text-decoration:none;
}

.secure{
    text-align:center;
    margin-top:10px;
    font-size:12px;
    opacity:0.7;
}

/* 📱 MOBILE */
@media(max-width:900px){
    .container{
        flex-direction:column;
        gap:20px;
    }

    .logo{
        width:200px;
        height:200px;
    }
}


</style>
</head>

<body>

<div class="container">

    <!-- 🔥 LEFT LOGO -->
    <div class="logo-section">
        <div class="logo-wrapper">
            <img src="uva_store_logo.png" class="logo">
        </div>
    </div>

    <!-- 🔥 RIGHT LOGIN -->
    <div class="login-box">

        <div class="title">
            <span>UVA</span> STORE
        </div>

        <div class="input-box">
            <input id="email" type="email" placeholder="Enter Email">
        </div>

        <div class="input-box">
            <input id="password" type="password" placeholder="Enter Password">
        </div>

        <button onclick="login()">Login</button>

        <div class="secure">🔒 Secure Login</div>

        <div class="link">
            New user? <a href="register.html">Register</a>
        </div>

    </div>

</div>

<script>

async function login(){

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if(!email || !password){
        alert("Enter all fields");
        return;
    }

    let res = await fetch("http://localhost:4000/login",{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:`email=${email}&password=${password}`
    });

    let userId = await res.text();

    if(userId === "Invalid"){
        alert("❌ Invalid credentials");
    }else{
        localStorage.setItem("user_id", userId);
        window.location.href="index.html";
    }
}

</script>

</body>
</html>
