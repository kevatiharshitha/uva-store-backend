<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<title>UVA STORE</title>
<style>
body{
    margin:0;
    font-family:Segoe UI;

    background: linear-gradient(135deg,#1e1e2f,#2b5876,#4e4376);
    background-size:300% 300%;
    animation: bgMove 10s ease infinite;

    color:#fff;
}

/* BACKGROUND ANIMATION */
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* HEADER */
body{
    margin:0;
    font-family:Segoe UI;

    background: linear-gradient(135deg,#1e1e2f,#2b5876,#4e4376);
    background-size:300% 300%;
    animation:bgMove 10s ease infinite;

    color:#fff;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* 🔥 HEADER */
.header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:15px 25px;

    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
}

/* 🔥 LEFT LOGO */
/* 🔥 LOGO BOX (like glowing square in your image) */
 /* rounded square */

  /* 🔥 WRAPPER */
.logo-wrapper{
    position:relative;
    width:70px;
    height:70px;
}

/* 🔥 ROTATING RING */
.logo-wrapper::before{
    content:"";
    position:absolute;

    width:100%;
    height:100%;

    border-radius:50%;

    background: conic-gradient(
        #00e0ff,
        #ff5e00,
        #00e0ff
    );

    animation:logoRotate 3s linear infinite;

    filter: blur(2px);   /* 🔥 glow */
    opacity:0.9;
}

/* 🔥 INNER CIRCLE (GLASS LOOK) */
.logo-box{
    position:absolute;
    top:5px;
    left:5px;

    width:60px;
    height:60px;

    border-radius:50%;   /* 🔥 circle */

    background: rgba(10,20,40,0.9);

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 0 20px #00e0ff,
        inset 0 0 10px rgba(255,255,255,0.1);

    z-index:1;
}

/* 🔥 IMAGE */
.logo-img{
    width:90%;
    height:90%;
    object-fit:cover;
    border-radius:50%;
}

/* 🔄 ROTATION */
@keyframes logoRotate{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
}
/* 🔥 ALIGN WITH TEXT */
.logo-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-img:hover{
    transform:scale(1.1);
}

/* TEXT */
.brand-text{
    font-size:22px;
    font-weight:600;
}

.uva{
    color:#00e0ff;
    text-shadow:0 0 10px #00e0ff;
}

.store{
    color:#fff;
}

/* 🔥 SEARCH */
/* 🔥 SEARCH CONTAINER */
.search-container{
    position:relative;
    width:420px;
}

/* 🔥 SEARCH INPUT */
.search{
    width:100%;
    padding:14px 20px 14px 50px;

    border-radius:40px;
    border:1px solid rgba(0,212,255,0.3);

    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);

    color:#fff;
    font-size:15px;

    outline:none;
    transition:0.4s ease;

    box-shadow:
        0 0 8px rgba(0,212,255,0.2);
}

/* 🔥 PLACEHOLDER */
.search::placeholder{
    color:#bfc9d4;
    letter-spacing:0.5px;
}

/* 🔥 ICON */
.search-icon{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);

    font-size:16px;

    color:#00d4ff;

    text-shadow:
        0 0 6px #00d4ff,
        0 0 12px rgba(0,212,255,0.6);
}

/* 🔥 FOCUS EFFECT (MAIN MAGIC) */
.search:focus{
    border:1px solid #00d4ff;

    box-shadow:
        0 0 10px #00d4ff,
        0 0 25px rgba(0,212,255,0.6);

    background: rgba(255,255,255,0.08);
}

/* 🔥 HOVER */
.search:hover{
    box-shadow:
        0 0 12px rgba(0,212,255,0.4);
}

/* 🔥 LOGOUT */
.logout-btn{
    padding:10px 18px;

    border:none;
    border-radius:10px;

    background: linear-gradient(45deg,#ff9f00,#ff5e00);
    color:#fff;

    cursor:pointer;
    transition:0.3s;
}

.logout-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 10px #ff9f00;
}

/* LAYOUT */
.container{
    display:flex;
}

/* SIDEBAR */
.sidebar{
    width:240px;
    height:100vh;

    background: rgba(0,0,0,0.6);
    padding:30px 20px;

    overflow-y:auto;
}

/* MENU ITEMS */
.sidebar div{
    display:flex;
    align-items:center;
    gap:18px;

    font-size:22px;
    margin:18px 0;
    padding:12px;

    border-radius:12px;
    cursor:pointer;

    transition:0.3s;
}

/* ICON */
.sidebar .icon{
    font-size:28px;
}

/* HOVER */
.sidebar div:hover{
    background: rgba(0,212,255,0.2);
    color:#00d4ff;
    transform:translateX(8px);
}

/* MAIN */
.main{
    flex:1;
    padding:20px;
}

/* PRODUCTS */
.products{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

/* CARD */
.card{
    width:230px;
    padding:15px;
    border-radius:15px;

    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);

    box-shadow:0 10px 25px rgba(0,0,0,0.4);

    transition:0.4s;
    animation: fadeUp 0.6s ease forwards;
    opacity:0;
}

/* CARD HOVER */
.card:hover{
    transform: translateY(-10px) scale(1.03);
    box-shadow:0 20px 40px rgba(0,212,255,0.3);
}

/* IMAGE */
.card img{
    width:100%;
    height:150px;
    object-fit:cover;
    border-radius:10px;
    transition:0.4s;
}

.card:hover img{
    transform:scale(1.05);
}

/* BUTTON */
.card button{
    width:100%;
    margin-top:10px;
    padding:10px;

    background: linear-gradient(45deg,#ff9f00,#ff5e00);
    border:none;
    border-radius:8px;

    color:#fff;
    cursor:pointer;

    transition:0.3s;
}

.card button:hover{
    transform:scale(1.05);
    box-shadow:0 0 10px #ff9f00;
}

/* CATEGORY */
.category-badge{
    display:inline-block;
    margin-top:5px;
    padding:4px 8px;
    font-size:12px;
    border-radius:6px;

    background:rgba(0,212,255,0.2);
    color:#00d4ff;
}

/* STOCK */
.stock{
    color:#00ffcc;
}
.stock.low{
    color:#ff4b2b;
}

/* CART BOX */
.cart-box{
    margin-top:20px;
    padding:12px;

    background: rgba(255,255,255,0.06);
    border-radius:12px;
}

/* CART HEADER */
.cart-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

/* COUNT */
#cart-count{
    background:#00d4ff;
    color:#000;
    padding:2px 8px;
    border-radius:10px;
}

/* CART LIST */
.cart-list{
    max-height:200px;
    overflow-y:auto;
}

/* CART ITEM */
.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;

    background: rgba(0,0,0,0.4);
    padding:8px;
    border-radius:8px;
    margin-bottom:8px;

    transition:0.3s;
}

.cart-item:hover{
    background: rgba(0,212,255,0.15);
}

/* BUY */
.buy-btn{
    width:100%;
    margin-top:10px;
    padding:10px;

    background: linear-gradient(45deg,#ff9f00,#ff5e00);
    border:none;
    border-radius:8px;
    color:#fff;

    cursor:pointer;
}

/* ANIMATIONS */
@keyframes fadeUp{
    from{
        transform:translateY(20px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

@keyframes pulseGlow{
    from{ filter: drop-shadow(0 0 5px #00d4ff); }
    to{ filter: drop-shadow(0 0 20px #00d4ff); }
}

@keyframes floatLogo{
    0%{ transform:translateY(0);}
    50%{ transform:translateY(-6px);}
    100%{ transform:translateY(0);}
}

.cart-box{
    margin-top:20px;
    padding:15px;

    background: rgba(255,255,255,0.06);
    border-radius:15px;

    cursor:pointer;
    transition:0.3s;

    display:flex;
    flex-direction:column;
    gap:10px;
}

.cart-box:hover{
    transform:scale(1.03);
    background: rgba(0,212,255,0.15);
}

.cart-preview{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

#cart-count{
    background:#00d4ff;
    color:#000;
    padding:4px 10px;
    border-radius:10px;
    font-weight:bold;
}

/* 🔥 PULSE EFFECT */
.logo-pulse{
    animation:logoPulse 0.6s ease;
}

@keyframes logoPulse{
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.25);
        box-shadow:
            0 0 25px #00e0ff,
            0 0 50px rgba(0,224,255,0.8);
    }
    100%{
        transform:scale(1);
    }
}

.logo-img{
    width:100%;
    height:100%;
    object-fit:cover;

    border-radius:50%;

    filter:
        drop-shadow(0 0 8px #00e0ff)
        drop-shadow(0 0 15px #00e0ff);
}
</style>
</head>

<body>

<div class="header">

    <!-- LEFT: LOGO -->
    <div class="logo-area">
        <div class="logo-wrapper">
            <div class="logo-box">
                <img src="uva_store_logo.png"
     class="logo-img"
     id="logo">
            </div>
        </div>

        <div class="brand-text">
            <span class="uva">UVA</span>
            <span class="store">STORE</span>
        </div>
    </div>

    <!-- CENTER: SEARCH -->
    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input 
            type="text" 
            class="search" 
            placeholder="Search products..."
            oninput="searchProducts()">
    </div>

    <!-- RIGHT: LOGOUT -->
    <button class="logout-btn" onclick="logout()">Logout</button>

</div>
<div class="container">

    <!-- SIDEBAR -->
  <div class="sidebar">

    <!-- MENU -->
    <div onclick="goHome()">
        <span class="icon">🏠</span> Home
    </div>

    <div onclick="viewOrders()">
        <span class="icon">📦</span> Orders
    </div>
<div onclick="viewCart()">
    <span class="icon">🛒</span> Cart
</div>
    <div onclick="viewProfile()">
        <span class="icon">👤</span> Profile
    </div>

    <hr>

    <div onclick="filterCategory('All')">
        <span class="icon">🛍️</span> All Products
    </div>

    <div onclick="filterCategory('Gadgets')">
        <span class="icon">📱</span> Gadgets
    </div>

    <div onclick="filterCategory('Clothing')">
        <span class="icon">👕</span> Clothing
    </div>

    <div onclick="filterCategory('Footwear')">
        <span class="icon">👟</span> Footwear
    </div>

    <hr>

    <!-- ✅ CART INSIDE SIDEBAR -->
  
</div>
    <!-- MAIN -->
    <div class="main">
        <h2>Products</h2>
        <div class="products" id="products"></div>
    </div>
 
</div>

<script>

/* LOGIN CHECK */
if(!localStorage.getItem("user_id")){
    window.location.href = "login.html";
}

let user_id =
    localStorage.getItem("user_id");

/* LOAD PRODUCTS */
async function loadProducts(){
    let res = await fetch("http://localhost:4000/products");
    let data = await res.json();
    window.allProducts = data;
    renderProducts(data);
}

/* RENDER */
function renderProducts(data){
    let html="";
    data.forEach((p,i)=>{
       html+=`
<div class="card" style="animation-delay:${i*0.1}s">
            <img src="${p.image}">
            <h4>${p.name}</h4>
            <p>₹${p.price}</p>

            <span class="category-badge">${p.category}</span>

            <p class="stock ${p.quantity<5?'low':''}">
                Stock: ${p.quantity}
            </p>

            <button 
            ${p.quantity===0?"disabled":""}
            onclick="addToCart(${p.id})">
            ${p.quantity===0?"Out of Stock":"Add"}
            </button>
        </div>`;
    });
    document.getElementById("products").innerHTML=html;
}

/* SEARCH */
function searchProducts(){
    let q = document.querySelector(".search").value.toLowerCase();
    let filtered = allProducts.filter(p =>
        p.name.toLowerCase().includes(q)
    );
    renderProducts(filtered);
}

/* FILTER */
function filterCategory(cat){
    if(cat==="All") return renderProducts(allProducts);
    renderProducts(allProducts.filter(p=>p.category===cat));
}

/* CART */


async function addToCart(id){

    try{

        await fetch(
            "http://localhost:4000/cart",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/x-www-form-urlencoded"
                },

                body:
                    `user_id=${user_id}&product_id=${id}`
            }
        );

        pulseLogo();

    }catch(err){

        alert("❌ Failed To Add");
    }
}



async function removeItem(id){
    await fetch(`http://localhost:4000/cart?id=${id}`,{method:"DELETE"});
    loadCart();
}

async function buy(){
    await fetch("http://localhost:4000/buy",{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:`user_id=${user_id}`
    });
    alert("Order placed!");
    loadCart();
}

/* NAV */
function goHome(){ location.reload(); }
function viewOrders(){ location.href="orders.html"; }
function viewCart(){
    window.location.href = "cart.html";
}
function viewProfile(){ location.href="profile.html"; }

/* LOGOUT */
function logout(){
    localStorage.removeItem("user_id");
    location.href="login.html";
}



function pulseLogo(){
    let logo = document.getElementById("logo");

    logo.classList.add("logo-pulse");

    setTimeout(()=>{
        logo.classList.remove("logo-pulse");
    }, 600);
}


/* INIT */
loadProducts();


</script>

</body>
</html>
