<!DOCTYPE html>
<html>

<head>
    <title>Orders - UVA STORE</title>

    <style>

        body{
            margin:0;
            font-family:Segoe UI;
            background: linear-gradient(135deg,#1e1e2f,#2b5876,#4e4376);
            color:#fff;
            min-height:100vh;
        }

        /* HEADER */
        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:15px 25px;

            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);

            box-shadow:0 5px 20px rgba(0,0,0,0.4);
        }

        .header h2{
            margin:0;
            font-size:30px;
        }

        /* BUTTONS */
        .top-buttons{
            display:flex;
            gap:10px;
        }

        button{
            border:none;
            padding:10px 18px;
            border-radius:10px;
            cursor:pointer;
            color:white;
            font-weight:bold;
            transition:0.3s;
        }

        button:hover{
            transform:scale(1.05);
        }

        .back-btn{
            background:#00bcd4;
        }

        .logout-btn{
            background:linear-gradient(45deg,#ff4b2b,#ff416c);
        }

        .cancel-btn{
            background:#ff3b30;
            width:100%;
            margin-top:15px;
        }

        /* MAIN */
        .container{
            padding:25px;
        }

        /* ORDER GRID */
        .orders{
            display:flex;
            flex-wrap:wrap;
            gap:25px;
        }

        /* ORDER CARD */
        .order{
            width:320px;

            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(15px);

            border-radius:18px;

            padding:18px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.5);

            animation:fadeIn 0.5s ease;
        }

        .order h3{
            margin-top:0;
            color:#00e0ff;
        }

        .status{
            color:#00ff99;
            font-weight:bold;
        }

        .date{
            opacity:0.7;
            font-size:14px;
        }

        /* ITEMS */
        .item{
            display:flex;
            gap:15px;

            background: rgba(255,255,255,0.05);

            padding:10px;
            border-radius:12px;

            margin-top:12px;
        }

        .item img{
            width:80px;
            height:80px;
            object-fit:cover;
            border-radius:10px;
        }

        .item-details{
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .item-details b{
            font-size:18px;
        }

        .price{
            color:#00ffcc;
            font-size:18px;
            margin-top:5px;
        }

        /* EMPTY */
        .empty{
            text-align:center;
            margin-top:100px;
            font-size:24px;
            opacity:0.7;
        }

        /* GLOW */
        .bg-glow{
            position:fixed;

            width:400px;
            height:400px;

            background:
                radial-gradient(circle,
                rgba(0,212,255,0.35),
                transparent);

            top:20%;
            left:35%;

            filter:blur(120px);

            z-index:-1;

            animation:moveGlow 8s infinite alternate;
        }

        @keyframes moveGlow{
            from{
                transform:translate(-50px,-50px);
            }
            to{
                transform:translate(50px,50px);
            }
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

    </style>
</head>

<body>

<div class="bg-glow"></div>

<!-- HEADER -->
<div class="header">

    <h2>📦 Your Orders</h2>

    <div class="top-buttons">

        <button
            class="back-btn"
            onclick="goBack()">

            ← Back

        </button>

        <button
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    </div>

</div>

<!-- MAIN -->
<div class="container">

    <div class="orders" id="orders"></div>

</div>

<script>

/* LOGIN CHECK */
if(!localStorage.getItem("user_id")){

    window.location.href = "login.html";
}

/* USER */
let user_id =
    localStorage.getItem("user_id");

/* LOAD ORDERS */
async function loadOrders(){

    try{

        let res = await fetch(
            `http://localhost:4000/orders?user_id=${user_id}`
        );

        let data = await res.json();

        let html = "";

        /* EMPTY */
        if(data.length === 0){

            html = `
                <div class="empty">
                    🛒 No Orders Found
                </div>
            `;
        }

        else{

            data.forEach(order => {

                html += `

                <div class="order">

                    <h3>
                        Order Status:
                        <span class="status">
                            ${order.status || "Paid"}
                        </span>
                    </h3>

                    <p class="date">
                        ${order.date || ""}
                    </p>

                `;

                /* ITEMS */
                order.items.forEach(item => {

                    html += `

                    <div class="item">

                        <img src="${item.image}">

                        <div class="item-details">

                            <b>${item.name}</b>

                            <div class="price">
                                ₹${item.price}
                            </div>

                        </div>

                    </div>

                    `;
                });

                html += `

                    <button
                        class="cancel-btn"
                        onclick="cancelOrder('${order.id}')">

                        Cancel Order

                    </button>

                </div>

                `;
            });
        }

        document.getElementById("orders")
            .innerHTML = html;

    }catch(err){

        console.log(err);

        document.getElementById("orders")
            .innerHTML = `
                <div class="empty">
                    Failed To Load Orders
                </div>
            `;
    }
}

/* CANCEL ORDER */
async function cancelOrder(id){

    try{

        let res = await fetch(
            `http://localhost:4000/orders?id=${id}`,
            {
                method:"DELETE"
            }
        );

        await res.text();

        showToast("❌ Order Cancelled");

        loadOrders();

    }catch(err){

        showToast("❌ Cancel Failed");
    }
}
/* BACK */
function goBack(){

    window.location.href =
        "index.html";
}

/* LOGOUT */
function logout(){

    localStorage.removeItem("user_id");

    window.location.href =
        "login.html";
}

/* INIT */
loadOrders();

function showToast(message){

    let toast =
        document.createElement("div");

    toast.innerText = message;

    toast.style.position = "fixed";

    toast.style.bottom = "30px";

    toast.style.right = "30px";

    toast.style.background = "#ff1744";

    toast.style.color = "white";

    toast.style.padding = "15px 25px";

    toast.style.borderRadius = "10px";

    toast.style.fontSize = "18px";

    toast.style.fontWeight = "bold";

    toast.style.zIndex = "9999";

    toast.style.boxShadow =
        "0 0 15px rgba(0,0,0,0.5)";

    document.body.appendChild(toast);

    setTimeout(()=>{

        toast.remove();

    },3000);
}

</script>

</body>
</html>
